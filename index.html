<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed · TBD Auction</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F8F8F8; color: #0A0A0A; margin: 0; padding: 32px 20px; text-align: center; }
    .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 28px 22px; box-shadow: 0 8px 24px #00000014; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #666; line-height: 1.5; }
    a.btn {
      display: block; margin-top: 18px; background: #CC1A1A; color: #fff; text-decoration: none;
      border-radius: 10px; padding: 14px 20px; font-weight: 700; font-size: 16px;
    }
  </style>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var raw = (location.search + location.hash).toLowerCase();
      var type = (q.get('type') || h.get('type') || '').toLowerCase();
      if (type === 'recovery' || raw.indexOf('recovery') !== -1) {
        location.replace('reset.html' + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Email confirmed</h1>
    <p>Your TBD Auction account is verified. Return to the app and sign in.</p>
    <a class="btn" id="open" href="tbdauc://login-callback">Open TBD Auction</a>
  </div>
  <script>
    document.getElementById('open').href = 'tbdauc://login-callback' + location.search + location.hash;
  </script>
</body>
</html>
